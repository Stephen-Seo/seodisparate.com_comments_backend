[package]
name = "seodisparate_comments_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
salvo = { version = "1.0", features = ["affix-state"] }
reqwest = { version = "0.13", features = ["json", "native-tls-vendored", "query"] }
tokio = "1.53"
uuid = { version = "1.27", features = ["v4"] }
serde = "1.0"
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "formatting", "local-offset"] }
libc = "0.2"
msql_ffi = { git = "https://github.com/Stephen-Seo/PoorMansAnubis.git", rev = "08fdec35bf3f524dad91e629724ad18df6e0b403" }
